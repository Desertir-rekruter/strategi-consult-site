<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1"><title>Вариант D</title>
<style>*{box-sizing:border-box;margin:0}body{font:17px -apple-system,sans-serif;position:relative}
/* нижний слой: фото — обычный блок (едет со страницей), но сдвигается навстречу прокрутке и визуально стоит */
.bg{position:absolute;left:0;right:0;top:0;height:100lvh;z-index:0;will-change:transform;
background:url(/test/assets/automation-backdrop-m.avif) center 35%/cover,url(/test/assets/automation-backdrop.jpg) center 35%/cover}
@supports (animation-timeline: scroll()){
.bg{animation:stay linear both;animation-timeline:scroll(root block)}
@keyframes stay{from{transform:translateY(0)}to{transform:translateY(var(--max,0px))}}}
/* верхний слой: карточки */
.wrap{padding:60px 16px 120px;position:relative;z-index:1}
.c{background:rgba(255,255,255,.35);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.5);border-radius:28px;height:230px;margin-bottom:14px;padding:22px;font-weight:600}</style></head>
<body><div class="bg" id="bg"></div><div class="wrap"><div class="c">Вариант D — два слоя: фото тоже «блок», но стоит на месте</div><div class="c">Карточка</div><div class="c">Карточка</div><div class="c">Карточка</div><div class="c">Карточка</div><div class="c">Карточка</div><div class="c">Карточка</div><div class="c">Карточка</div><div class="c">Карточка</div><div class="c">Карточка</div><div class="c">Карточка</div></div>
<script>
var bg=document.getElementById('bg'),css=CSS.supports('animation-timeline: scroll()');
function max(){bg.style.setProperty('--max',(document.documentElement.scrollHeight-innerHeight)+'px')}
max();addEventListener('resize',max);
if(!css)addEventListener('scroll',function(){bg.style.transform='translateY('+scrollY+'px)'},{passive:true});
</script></body></html>
