<!doctype html>

<head>

<title>Поток документов</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: один экран-hero. Поток реальных документов на всю площадь, заголовок внизу слева, служебная подпись справа. Контрастный ч/б: чистый белый и чёрный. */
:root{
  color-scheme:light;
  --bg:#FFFFFF; --ink:#000000; --muted:#3A3A3A; --line:rgba(0,0,0,.9);
  --btn:#000000; --btn-ink:#FFFFFF;
  --grot:"Inter Tight","Helvetica Neue",Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
:root.dark{color-scheme:dark;--bg:#000000;--ink:#FFFFFF;--muted:#C8C8C8;--line:rgba(255,255,255,.9);--btn:#FFFFFF;--btn-ink:#000000}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--grot);overflow:hidden}
.hero{position:relative;height:100%;min-height:560px;overflow:hidden;background:var(--bg);transition:background .4s}
canvas#gl{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:pan-y}
.ui{position:absolute;inset:0;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;
  padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));padding-block:14px 28px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:2px solid var(--line);pointer-events:auto}
.brand{font-weight:900;letter-spacing:.02em;font-size:15px;text-transform:uppercase}
.mode{font:500 11px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;border:2px solid var(--ink);color:var(--ink);background:var(--bg);padding:8px 10px;border-radius:0;cursor:pointer}
.mode:focus-visible,.cta:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.tag{align-self:flex-end;max-width:290px;text-align:right;font:500 12px/1.55 var(--mono);letter-spacing:.04em;text-transform:uppercase;color:var(--ink);margin-top:14vh;
  background:var(--bg);padding:8px 10px}
.tag b{display:block;font-weight:500;margin-bottom:6px;border-bottom:2px solid var(--ink);padding-bottom:6px}
.bottom{display:flex;flex-direction:column;gap:20px}
h1{margin:0;font-weight:900;text-transform:uppercase;letter-spacing:-.04em;line-height:.88;font-size:clamp(40px,7.8vw,116px);text-wrap:balance}
h1 span{display:block}
.row{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.cta{pointer-events:auto;font:700 15px/1 var(--grot);color:var(--btn-ink);background:var(--btn);border:0;border-radius:0;padding:17px 22px;cursor:pointer;letter-spacing:.01em}
.meta{font:500 11px/1.4 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink)}
@media (max-width:620px){
  .tag{margin-top:6px;max-width:220px;font-size:11px}
  h1{font-size:clamp(34px,10.4vw,50px)}
  .meta{display:none}
}
</style>
</head>
<body>
<section class="hero">
  <canvas id="gl" aria-hidden="true"></canvas>

    <div class="top">
      <span class="brand">Strategi-consult</span>

    <div class="bottom">

      <div class="row">
        <button class="cta" type="button">Получить бесплатный аудит →</button>
        <span class="meta">30 минут · бесплатно</span>
      </div>
    </div>
  </div>
</section>

}
function deloTex(){const W=512,H=740,c=document.createElement('canvas');c.width=W;c.height=H;const g=c.getContext('2d');
  g.fillStyle='#f3f1ea';g.fillRect(0,0,W,H);g.strokeStyle='#000';g.lineWidth=3;g.strokeRect(26,26,W-52,H-52);
  g.fillStyle='#000';g.textAlign='center';g.font='bold 64px Arial';g.fillText('Д Е Л О  №',W/2,180);g.lineWidth=2;g.beginPath();g.moveTo(120,250);g.lineTo(W-120,250);g.stroke();
  g.textAlign='left';g.font='22px Arial';['Начато','Окончено','На            листах','Хранить'].forEach((t,i)=>{g.fillText(t,70,420+i*62);g.beginPath();g.moveTo(200,424+i*62);g.lineTo(W-70,424+i*62);g.stroke()});
  g.fillStyle='#1f3fa8';g.font='italic 30px "Times New Roman",serif';g.fillText('Личные дела сотрудников',112,320);
  grain(g,W,H,16);const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=renderer.capabilities.getMaxAnisotropy();return t}

/* лист с лёгким изгибом; оборот листа чисто-белый */
function bentSheet(w,h,bend){const g=new THREE.PlaneGeometry(w,h,12,1),p=g.attributes.position;for(let i=0;i<p.count;i++){const x=p.getX(i)/(w/2);p.setZ(i,bend*(x*x-.4))}g.computeVertexNormals();return g}
function paperMat(tex){const m=new THREE.MeshStandardMaterial({map:tex,roughness:.92,side:THREE.DoubleSide});
  m.onBeforeCompile=s=>{s.fragmentShader=s.fragmentShader.replace('#include <map_fragment>','#include <map_fragment>\nif(!gl_FrontFacing) diffuseColor.rgb=vec3(.97);')};return m}
const sheetGeo=bentSheet(.86,1.22,.05);
const DOCS=['contract','order','memo','resA1','resA2','resB','resC','timesheet','report','application'];
const docs=DOCS.map(k=>paperMat(doc(k)));
function rounded(pts,r){const s=new THREE.Shape(),P=pts.map(([x,y])=>new THREE.Vector2(x,y)),n=P.length;
  for(let i=0;i<n;i++){const a=P[(i-1+n)%n],b=P[i],c=P[(i+1)%n],rr=Math.min(r,a.distanceTo(b)/2,c.distanceTo(b)/2);
    const p1=b.clone().add(a.clone().sub(b).normalize().multiplyScalar(rr)),p2=b.clone().add(c.clone().sub(b).normalize().multiplyScalar(rr));
    i?s.lineTo(p1.x,p1.y):s.moveTo(p1.x,p1.y);s.quadraticCurveTo(b.x,b.y,p2.x,p2.y)}return s}
const ext=(shape,d)=>new THREE.ExtrudeGeometry(shape,{depth:d,bevelEnabled:true,bevelThickness:.006,bevelSize:.006,bevelSegments:2,curveSegments:4});
/* чёрная пластиковая папка: задник с ярлыком, створка, бумаги внутри */
const blackMat=new THREE.MeshPhysicalMaterial({color:0x050505,roughness:.28,clearcoat:1,clearcoatRoughness:.15});
const bBackGeo=ext(rounded([[-.6,-.46],[.6,-.46],[.6,.4],[-.06,.4],[-.14,.5],[-.6,.5]],.035),.016);
const bFrontGeo=ext(rounded([[-.6,-.46],[.6,-.46],[.6,.3],[-.6,.3]],.03),.016);bFrontGeo.translate(0,0,.05);
const bPaperGeo=new THREE.BoxGeometry(1.08,.84,.01);bPaperGeo.translate(0,.03,.034);
/* картонная папка «Дело» с бумагами, торчащими сверху */
const deloGeo=new THREE.BoxGeometry(.94,1.3,.03);
const card=new THREE.MeshStandardMaterial({color:0xe9e6dd,roughness:.95});
const deloMats=[card,card,card,card,new THREE.MeshStandardMaterial({map:deloTex(),roughness:.95}),card];
const dPaperGeo=new THREE.BoxGeometry(.86,1.26,.02);dPaperGeo.translate(.01,.06,-.026);
const whitePaper=new THREE.MeshStandardMaterial({color:0xfbfbf9,roughness:.9});

/* состав потока */
const N=74;
const rnd=i=>Math.abs((Math.sin(i*12.9898+4.1)*43758.5453)%1);
// резюме чаще остальных: примерно 45% потока
const W8=[1,1,1,2,2,2,2,1,1,1],SUM=W8.reduce((a,b)=>a+b);
const kinds=[...Array(N)].map((_,i)=>{let r=rnd(i)*SUM,k=0;while(r>=W8[k]){r-=W8[k];k++}return 's'+k});
const count=k=>kinds.filter(x=>x===k).length;
const ribbon=new THREE.Group();scene.add(ribbon);
function inst(geo,mat,n){const m=new THREE.InstancedMesh(geo,mat,Math.max(1,n));m.count=n;m.castShadow=true;m.receiveShadow=true;m.instanceMatrix.setUsage(THREE.DynamicDrawUsage);ribbon.add(m);return m}
const groups={},idx={};DOCS.forEach((_,k)=>{groups['s'+k]=[inst(sheetGeo,docs[k],count('s'+k))];idx['s'+k]=0});
const slot=kinds.map(k=>[groups[k],idx[k]++]);

const curve=new THREE.CatmullRomCurve3([[-11,3.4,-1.5],[-7,2.6,0],[-3.6,.4,.8],[-.6,-.6,.4],[2.2,.9,-.4],[4.4,1.6,0],[6.6,-.6,.6],[9,-3.2,0],[12,-5,-1]].map(a=>new THREE.Vector3(...a)),false,'catmullrom',.5);

/* отлетевшие листки-стикеры и скрепки-обрывки */
const bits=inst(new THREE.BoxGeometry(.22,.3,.005),new THREE.MeshStandardMaterial({roughness:.85}),24);
const col=new THREE.Color();
const bitData=[...Array(24)].map((_,i)=>{const p=curve.getPointAt(rnd(i+90));bits.setColorAt(i,col.set(i%4?'#fbfbf9':'#050505'));
  return{base:p.add(new THREE.Vector3((rnd(i+7)-.5)*3.2,(rnd(i+13)-.5)*4.6,(rnd(i+21)-.5)*2.5)),ph:rnd(i+3)*6.28,sp:.3+rnd(i+5)*.5,r:new THREE.Euler(rnd(i)*3,rnd(i+1)*3,rnd(i+2)*3)}});
bits.instanceColor.needsUpdate=true;

const m4=new THREE.Matrix4(),q=new THREE.Quaternion(),q2=new THREE.Quaternion(),Z=new THREE.Vector3(0,0,1),one=new THREE.Vector3(1,1,1);
const n=new THREE.Vector3(),x=new THREE.Vector3(),y=new THREE.Vector3(),T=new THREE.Vector3(),eu=new THREE.Euler(),nx=new THREE.Vector3();
let off=0,last=performance.now(),mx=0,my=0,tmx=0,tmy=0,visible=true;
/* мышь пугает документы: точка курсора на плоскости ленты, листы отскакивают и плавно возвращаются */
const ndc=new THREE.Vector2(9,9),ray=new THREE.Raycaster(),plane=new THREE.Plane(new THREE.Vector3(0,0,1),0),hit=new THREE.Vector3(),mLoc=new THREE.Vector3(),hasM={v:false};
const push=[...Array(N)].map(()=>new THREE.Vector3()),tgt=new THREE.Vector3(),R=2.3;
addEventListener('pointermove',e=>{tmx=e.clientX/innerWidth*2-1;tmy=e.clientY/innerHeight*2-1;const r=canvas.getBoundingClientRect();ndc.set((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1);hasM.v=true});
addEventListener('pointerleave',()=>{hasM.v=false});document.addEventListener('mouseleave',()=>{hasM.v=false});addEventListener('pointerup',e=>{if(e.pointerType==='touch')hasM.v=false});
new IntersectionObserver(([e])=>visible=e.isIntersecting).observe(canvas);

function layout(){
  const w=canvas.clientWidth,h=canvas.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();
  const a=w/h;
  if(a<1){ribbon.scale.setScalar(.34+.3*a);ribbon.rotation.z=-.62;ribbon.position.set(0,.9,0)}
  else{ribbon.scale.setScalar(Math.min(1,.62+.25*a));ribbon.rotation.z=0;ribbon.position.set(0,.5,0)}
}
addEventListener('resize',layout);layout();

function frame(now){
  const dt=Math.max(0,Math.min(.05,(now-last)/1000));last=now;
  if(!reduce)off=(off+dt*.015)%1;
  mx+=(tmx-mx)*.04;my+=(tmy-my)*.04;
  const t=now/1000;
  ribbon.rotation.y=mx*.12;ribbon.rotation.x=my*.08;
  ribbon.updateMatrixWorld();
  let mOn=false;if(hasM.v){ray.setFromCamera(ndc,camera);if(ray.ray.intersectPlane(plane,hit)){mLoc.copy(hit);ribbon.worldToLocal(mLoc);mOn=true}}
  for(let i=0;i<N;i++){
    const u=(((i/N)+off)%1+1)%1;
    const p=curve.getPointAt(u);curve.getTangentAt(u,T);
    const k=1.0+.35*Math.sin(u*9+t*.6);
    n.copy(T).addScaledVector(Z,k).normalize();
    x.copy(T).addScaledVector(n,-T.dot(n)).normalize();
    y.crossVectors(n,x);
    m4.makeBasis(x,y,n);q.setFromRotationMatrix(m4);
    tgt.set(0,0,0);
    if(mOn){const dx=p.x-mLoc.x,dy=p.y-mLoc.y,d=Math.hypot(dx,dy);if(d<R){const f=Math.pow(1-d/R,2)*1.36,inv=1/Math.max(d,.001);tgt.set(dx*inv*f,dy*inv*f,f*.9)}}
    push[i].lerp(tgt,tgt.lengthSq()>push[i].lengthSq()?.18:.05);
    p.add(push[i]);
    eu.set(Math.sin(t*1.1+i)*.1+push[i].y*.5,Math.cos(t*.9+i*1.7)*.12-push[i].x*.5,Math.sin(t*.7+i*2.3)*.18+push[i].x*.3);q2.setFromEuler(eu);q.multiply(q2);
    m4.compose(p,q,one);
    const [ms,j]=slot[i];for(const m of ms)m.setMatrixAt(j,m4);
  }
  for(const k in groups)for(const m of groups[k])m.instanceMatrix.needsUpdate=true;
  bitData.forEach((c,i)=>{const p=c.base.clone();p.y+=Math.sin(t*c.sp+c.ph)*.3;p.x+=Math.cos(t*c.sp*.7+c.ph)*.18;
    eu.set(c.r.x+t*c.sp*.6,c.r.y+t*c.sp*.4,c.r.z+t*.2);q.setFromEuler(eu);m4.compose(p,q,one);bits.setMatrixAt(i,m4)});
  bits.instanceMatrix.needsUpdate=true;
  if(visible)renderer.render(scene,camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

const mode=document.getElementById('mode');
mode.onclick=()=>{const d=document.documentElement.classList.toggle('dark');mode.textContent=d?'Светлая':'Тёмная';mode.setAttribute('aria-pressed',d);catcher.material.opacity=d?0:.13};
})();
</script>
